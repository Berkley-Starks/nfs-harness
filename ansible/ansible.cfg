[defaults]
inventory = ./inventory/hosts.ini
host_key_checking = False
remote_user = ec2-user
roles_path = ./roles
retry_files_enabled = False
# Use default stdout callback (the old `yaml` callback was removed in ansible-core
# 2.13+/community.general 12). result_format keeps task results readable.
result_format = yaml
# Inventory is generated by bin/harness from `terraform output`. SSH key is
# resolved from your agent / ssh config; override with --private-key if needed.

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
pipelining = True
