---
- name: Fail fast if no NFS endpoint was provided
  ansible.builtin.assert:
    that:
      - nfs_endpoint | length > 0
    fail_msg: "nfs_endpoint is empty — pass it via -e (bin/harness reads it from terraform output)."

- name: Install NFS client utilities
  ansible.builtin.dnf:
    name: nfs-utils
    state: present

# Skip when already mounted: chmod on a live root-squashed NFS root arrives as
# nobody and EPERMs — the perms only matter for the empty dir pre-mount anyway
# (re-run idempotency bug found by the dsx e2e).
- name: Ensure mount point exists
  ansible.builtin.file:
    path: "{{ nfs_mount_point }}"
    state: directory
    mode: "0777"
  when: nfs_mount_point not in (ansible_facts.mounts | map(attribute='mount') | list)

- name: Mount the NFS share
  ansible.posix.mount:
    path: "{{ nfs_mount_point }}"
    src: "{{ nfs_endpoint }}:{{ nfs_export_path }}"
    fstype: "{{ nfs_fstype }}"
    opts: "{{ nfs_mount_opts }}"
    state: mounted

- name: Confirm the mount is live
  ansible.builtin.command: findmnt --target {{ nfs_mount_point }}
  changed_when: false

###############################################################################
# DSX dual-protocol mode: a SECOND mount, NFSv3, to the portal netns on the
# server. Same workload, two protocols, one Grafana — mountstats reports each
# mount separately. Option notes:
#   vers=3                 the portal refuses v4 by design
#   port=2049,mountport=N  both endpoints pinned -> no rpcbind round-trip
#   nolock                 skip NLM; the portal runs no statd/lockd (fio doesn't lock)
###############################################################################
- name: "DSX: ensure portal mount point exists"
  ansible.builtin.file:
    path: "{{ dsx_mount_point }}"
    state: directory
    mode: "0777"
  when:
    - dsx_mode | default(false) | bool
    - dsx_mount_point not in (ansible_facts.mounts | map(attribute='mount') | list)

- name: "DSX: mount the NFSv3 portal"
  ansible.posix.mount:
    path: "{{ dsx_mount_point }}"
    src: "{{ dsx_portal_ip }}:{{ dsx_export_dir }}"
    fstype: nfs
    opts: "vers=3,proto=tcp,mountproto=tcp,port=2049,mountport={{ dsx_mountd_port }},nolock,hard,timeo=600,retrans=2,_netdev"
    state: mounted
  when: dsx_mode | default(false) | bool

# 'vers=3' must appear in the mount opts. Substring check, not equality: the
# opts line contains BOTH vers=3 and mountvers=3, so grep -o emits two matches.
- name: "DSX: confirm the portal mount is live and actually v3"
  ansible.builtin.shell: nfsstat -m | grep -A1 "{{ dsx_mount_point }}"
  register: dsx_vers
  changed_when: false
  failed_when: "'vers=3' not in dsx_vers.stdout"
  when: dsx_mode | default(false) | bool
