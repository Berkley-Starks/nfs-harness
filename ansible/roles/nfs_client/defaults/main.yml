---
nfs_mount_point: /mnt/nfs

# Defaults assume EFS; bin/harness overrides nfs_endpoint / nfs_export_path /
# nfs_backend from terraform output. EFS speaks NFSv4.1; a self-managed AL2023
# server here exports plain NFS.
nfs_backend: efs
nfs_endpoint: ""
nfs_export_path: "/"

# fstype + mount opts derived from the backend.
nfs_fstype: "{{ 'nfs4' if nfs_backend == 'efs' else 'nfs' }}"
nfs_mount_opts: "{{ 'nfsvers=4.1,rsize=1048576,wsize=1048576,hard,timeo=600,retrans=2,noresvport,_netdev' if nfs_backend == 'efs' else 'rw,hard,timeo=600,retrans=2,_netdev' }}"
