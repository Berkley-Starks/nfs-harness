---
node_exporter_version: "1.8.2"
node_exporter_arch: "linux-amd64"
node_exporter_user: "node_exporter"
# Collectors that matter for an NFS harness: mountstats + nfs expose NFS client
# operation counts/latency; ethtool exposes the ENA driver counters
# (bw_in/out_allowance_exceeded) that prove when the instance is hitting its NIC
# bandwidth allowance — the difference between "the workload is slow" and "the
# pipe is capped". The rest are node_exporter defaults.
node_exporter_extra_flags: "--collector.mountstats --collector.nfs --collector.ethtool"
