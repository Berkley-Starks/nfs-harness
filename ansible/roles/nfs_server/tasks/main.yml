---
# DSX protocol portal — only when the run was applied with dsx_mode=true
# (bin/harness injects the var from terraform output). Import, not include:
# static, so --syntax-check and --list-tasks always see it.
- name: DSX protocol portal
  ansible.builtin.import_tasks: dsx.yml
  when: dsx_mode | default(false) | bool

# Apply (or clear) a reproducible tbf egress cap on the server's primary
# interface. See defaults/main.yml for the rationale.

- name: Resolve primary network interface
  ansible.builtin.set_fact:
    nfs_server_iface: "{{ ansible_facts['default_ipv4']['interface'] }}"

# tc ships in iproute-tc, which is NOT installed on AL2023 by default. Only pull
# it in when we actually need to shape — the uncapped default touches no tc.
- name: Ensure tc is installed (only when shaping)
  ansible.builtin.dnf:
    name: iproute-tc
    state: present
  when: server_egress_cap_mbit | int > 0

- name: Apply tbf egress cap on the server NIC
  ansible.builtin.command:
    cmd: >-
      tc qdisc replace dev {{ nfs_server_iface }} root
      tbf rate {{ server_egress_cap_mbit }}mbit burst 32kbit latency 400ms
  when: server_egress_cap_mbit | int > 0
  changed_when: true

# Uncapped run: clear a prior cap only if tc is present. No tc binary means no
# cap was ever applied, so there is nothing to undo — skip cleanly.
- name: Check whether tc is present
  ansible.builtin.stat:
    path: /usr/sbin/tc
  register: tc_bin
  when: server_egress_cap_mbit | int <= 0

- name: Remove any tbf egress cap (uncapped run)
  ansible.builtin.command:
    cmd: tc qdisc del dev {{ nfs_server_iface }} root
  when:
    - server_egress_cap_mbit | int <= 0
    - tc_bin.stat.exists | default(false)
  register: tc_clear
  changed_when: tc_clear.rc == 0
  # No root qdisc to delete is the normal/uncapped state — not a failure.
  failed_when: tc_clear.rc != 0 and 'RTNETLINK' not in tc_clear.stderr and 'Cannot' not in tc_clear.stderr
